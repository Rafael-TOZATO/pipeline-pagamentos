name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Shell and JSON validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Scan for exposed secrets
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate shell syntax
        run: bash -n setup.sh teardown.sh

      - name: Lint shell scripts
        run: shellcheck --exclude=SC1091 setup.sh teardown.sh

      - name: Validate JSON and Avro syntax
        run: |
          for file in connectors/cdc.json. evidencias/01-envelopes-cdc.json. schemas/payment_v2.avsc schemas/payment_v3_broken.avsc; do
            jq -e . "$file" >/dev/null
          done
